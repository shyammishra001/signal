<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHYAM AI Token Vault</title></head>
<body>
<script>
(function () {
  "use strict";
  var KEY = "shyam_ai_indstocks_token_v1";
  var memory = {token:"", expires_at:0, storage:"none"};
  function now(){ return Math.floor(Date.now()/1000); }
  function readOne(store, name) {
    try {
      var raw = store.getItem(KEY);
      if (!raw) return null;
      var x = JSON.parse(raw);
      if (x && x.token && Number(x.expires_at) > now()) { x.storage=name; return x; }
      store.removeItem(KEY);
    } catch(e) {}
    return null;
  }
  function readSaved(){ return readOne(window.localStorage,"localStorage") || readOne(window.sessionStorage,"sessionStorage") || memory; }
  function writeSaved(token, requestId){
    var x={token:String(token||"").trim(),expires_at:now()+86400,request_id:requestId,storage:"memory"};
    var raw=JSON.stringify(x), localError="";
    try { window.localStorage.setItem(KEY,raw); x.storage="localStorage"; memory=x; return {value:x,error:""}; }
    catch(e){ localError=String(e && e.message || e); }
    try { window.sessionStorage.setItem(KEY,raw); x.storage="sessionStorage"; memory=x; return {value:x,error:""}; }
    catch(e2){ memory=x; return {value:x,error:"localStorage: "+localError+"; sessionStorage: "+String(e2 && e2.message || e2)}; }
  }
  function clearSaved(requestId){
    var errors=[];
    try{window.localStorage.removeItem(KEY);}catch(e){errors.push(String(e));}
    try{window.sessionStorage.removeItem(KEY);}catch(e){errors.push(String(e));}
    memory={token:"",expires_at:0,storage:"none",request_id:requestId};
    return {value:memory,error:errors.join("; ")};
  }
  function send(x){
    window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",value:x,dataType:"json"},"*");
  }
  function height(){window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setFrameHeight",height:1},"*");}
  function onRender(event){
    var m=event && event.data;
    if(!m || m.type!=="streamlit:render") return;
    var args=m.args||{}, cmd=args.command||{}, result;
    if(cmd.action==="save" && cmd.request_id){
      var previous=readSaved();
      if(previous.request_id===cmd.request_id && previous.token){
        result={token:previous.token,expires_at:previous.expires_at,storage:previous.storage,status:"saved",request_id:cmd.request_id};
      } else {
        var saved=writeSaved(cmd.token,cmd.request_id);
        result={token:saved.value.token,expires_at:saved.value.expires_at,storage:saved.value.storage,status:saved.error?"error":"saved",message:saved.error,request_id:cmd.request_id};
      }
    } else if(cmd.action==="clear" && cmd.request_id){
      var cleared=clearSaved(cmd.request_id);
      result={token:"",expires_at:0,storage:"none",status:cleared.error?"error":"cleared",message:cleared.error,request_id:cmd.request_id};
    } else {
      var x=readSaved();
      result={token:x.token||"",expires_at:x.expires_at||0,storage:x.storage||"none",status:x.token?"loaded":"empty",request_id:x.request_id||""};
    }
    send(result); height();
  }
  window.addEventListener("message",onRender);
  window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1},"*");
  height();
})();
</script>
</body></html>
