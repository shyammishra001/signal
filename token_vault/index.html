<!-- FIX 1: sirf unpkg par bharosa nahi. unpkg fail ho to jsdelivr se load hoga -->
<script>
  // Streamlit lib load karne ka safe tarika - pehle unpkg, fail ho to jsdelivr
  function loadStreamlitLib(onReady) {
    if (window.Streamlit) { onReady(); return; }
    var s1 = document.createElement('script');
    s1.src = 'https://unpkg.com/streamlit-component-lib@1.4.0/dist/index.js';
    s1.onload = function(){ onReady(); };
    s1.onerror = function(){
      var s2 = document.createElement('script');
      s2.src = 'https://cdn.jsdelivr.net/npm/streamlit-component-lib@1.4.0/dist/index.js';
      s2.onload = function(){ onReady(); };
      s2.onerror = function(){ console.error('Streamlit lib dono CDN se fail'); };
      document.head.appendChild(s2);
    };
    document.head.appendChild(s1);
  }
</script>
</head>
<body>
<script>
const KEY = "shyam_ai_indstocks_token_v1";
let lastSent = ""; // FIX 2: baar-baar same value bhejne se auto-refresh loop banta tha, isliye yaad rakhenge

function send(value) {
  try {
    var json = JSON.stringify(value || {token:"", expires_at:0});
    if (json === lastSent) return; // same value dobara mat bhejo - warna har 15 sec me rerun loop
    lastSent = json;
    Streamlit.setComponentValue(value);
  } catch(e) { console.error("send fail", e); }
}

function readVault() {
  try {
    // FIX 3: kuch browser Streamlit Cloud ke iframe me localStorage block kar dete hain (SecurityError)
    // isliye try/catch zaroori hai, warna pura JS crash ho jata tha
    const raw = localStorage.getItem(KEY);
    if (!raw) return {token:"", expires_at:0};
    const data = JSON.parse(raw);
    if (!data.token || !data.expires_at || Date.now()/1000 >= data.expires_at) {
      try { localStorage.removeItem(KEY); } catch(e) {}
      return {token:"", expires_at:0};
    }
    return data;
  } catch (e) {
    console.warn("localStorage read block/fail:", e);
    return {token:"", expires_at:0};
  }
}

function onRender(event) {
  try {
    const args = (event && event.detail && event.detail.args) || {};
    // FIX 4: save_token "" hone par bhi clear mat samjho. Sirf jab Python ne sach me save bola ho.
    // Python har auto-refresh (15 sec) me save_token="" bhejta hai, iska matlab clear nahi hai.
    if (args.clear_token === true) {
      try { localStorage.removeItem(KEY); } catch(e) {}
      lastSent = ""; // clear ke baad dobara bhejne do
      send({token:"", expires_at:0});
      Streamlit.setFrameHeight(1);
      return;
    }
    if (args.save_token && String(args.save_token).trim() !== "") {
      const data = {token:String(args.save_token), expires_at:Math.floor(Date.now()/1000)+86400};
      try {
        localStorage.setItem(KEY, JSON.stringify(data));
        console.log("Token computer me save ho gaya, expiry:", data.expires_at);
      } catch(e) {
        console.error("localStorage save BLOCK hua:", e);
        // localStorage block hai to bhi Python ko token de do, taaki isi session me kaam chale
      }
      lastSent = "";
      send(data);
      Streamlit.setFrameHeight(1);
      return;
    }
    // Normal case: har 15 sec ke auto-refresh me yahi chalega - computer se padh ke Python ko dega
    send(readVault());
    Streamlit.setFrameHeight(1);
  } catch(e) { console.error("onRender fail", e); }
}

function start() {
  // FIX 5: pehle wale code me Streamlit load hone se pehle hi setComponentReady() call ho jata tha
  // agar unpkg slow ho to "Streamlit is not defined" bol ke pura JS crash ho jata tha
  // ab Streamlit milne ka wait karenge, tabhi start karenge
  if (!window.Streamlit || !window.Streamlit.events) {
    setTimeout(start, 100);
    return;
  }
  Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
  Streamlit.setComponentReady();
  Streamlit.setFrameHeight(1);
  // Pehli baar khud se bhi bhej do, taaki Python ko wait na karna pade
  setTimeout(function(){ send(readVault()); }, 200);
}
loadStreamlitLib(start);
</script>
