<!doctype html>
<html>
<head><meta charset="utf-8">
<script>
  function loadStreamlitLib(onReady) {
    if (window.Streamlit && window.Streamlit.events) { onReady(); return; }
    var s1 = document.createElement('script');
    s1.src = 'https://unpkg.com/streamlit-component-lib@1.4.0/dist/index.js';
    s1.onload = function(){ onReady(); };
    s1.onerror = function(){
      var s2 = document.createElement('script');
      s2.src = 'https://cdn.jsdelivr.net/npm/streamlit-component-lib@1.4.0/dist/index.js';
      s2.onload = function(){ onReady(); };
      s2.onerror = function(){ setTimeout(function(){ loadStreamlitLib(onReady); }, 500); };
      document.head.appendChild(s2);
    };
    document.head.appendChild(s1);
  }
</script>
</head>
<body>
<script>
var KEY = "shyam_ai_indstocks_token_v1";
var memoryToken = null;

function safeGet() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var d = JSON.parse(raw); if (d.token && d.expires_at && Date.now()/1000 < d.expires_at) return d; }
  } catch(e) {}
  try {
    var raw2 = sessionStorage.getItem(KEY);
    if (raw2) { var d2 = JSON.parse(raw2); if (d2.token && d2.expires_at && Date.now()/1000 < d2.expires_at) return d2; }
  } catch(e) {}
  if (memoryToken && memoryToken.expires_at && Date.now()/1000 < memoryToken.expires_at) return memoryToken;
  return {token:"", expires_at:0};
}

function safeSave(data) {
  memoryToken = data;
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e) { console.warn("localStorage save block:", e); }
  try { sessionStorage.setItem(KEY, JSON.stringify(data)); } catch(e) {}
}

function safeClear() {
  memoryToken = null;
  try { localStorage.removeItem(KEY); } catch(e) {}
  try { sessionStorage.removeItem(KEY); } catch(e) {}
}

function send(value) {
  try { Streamlit.setComponentValue(value || {token:"", expires_at:0}); } catch(e) { console.error("send fail", e); }
}

function onRender(event) {
  try {
    var args = (event && event.detail && event.detail.args) || {};
    if (args.clear_token === true) {
      safeClear();
      send({token:"", expires_at:0});
      try { Streamlit.setFrameHeight(1); } catch(e) {}
      return;
    }
    if (args.save_token && String(args.save_token).trim() !== "") {
      var data = {token: String(args.save_token).trim(), expires_at: Math.floor(Date.now()/1000) + 86400};
      safeSave(data);
      send(data);
      try { Streamlit.setFrameHeight(1); } catch(e) {}
      return;
    }
    send(safeGet());
    try { Streamlit.setFrameHeight(1); } catch(e) {}
  } catch(e) { console.error("onRender fail", e); }
}

function start() {
  if (!window.Streamlit || !window.Streamlit.events) { setTimeout(start, 100); return; }
  Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
  Streamlit.setComponentReady();
  Streamlit.setFrameHeight(1);
  setTimeout(function(){ send(safeGet()); }, 100);
  setTimeout(function(){ send(safeGet()); }, 600);
}
loadStreamlitLib(start);
</script>
</body>
</html>
